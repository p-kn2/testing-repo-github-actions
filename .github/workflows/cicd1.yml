name: CICD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'github/workflows/**'

jobs:

  firstjob:
    runs-on: [self-hosted, ec2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test command
        run: echo "Hello from GitHub Actions"


  security-checksjob:
    runs-on: [self-hosted, ec2]
    needs: firstjob

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Gitleaks only if it is not already installed
      - name: Setup Gitleaks
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gitleaks
          fi
          gitleaks version

      - name: Gitleaks scan
        run: |
          gitleaks detect \
            --source . \
            --report-path gitleaks-report.json \
            --report-format json \
            --verbose

      # Install/setup Trivy
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.68.2
          cache: true

      - name: Trivy filesystem scan
        run: |
          trivy fs \
            --format json \
            --output trivy-report.json \
            .

      - name: Show generated reports
        run: |
          ls -lh gitleaks-report.json trivy-report.json
